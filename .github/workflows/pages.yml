name: Deploy AUREON-I30 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PWA structure and service worker version
        shell: bash
        run: |
          set -euo pipefail
          test -f manifest.webmanifest
          test -f sw.js
          test -f offline.html
          test -f icon-192.png
          test -f icon-512.png
          test -f icon-512-maskable.png
          grep -q '"display": "standalone"' manifest.webmanifest
          grep -q '"192x192"' manifest.webmanifest
          grep -q '"512x512"' manifest.webmanifest
          grep -q '"purpose":"maskable"' manifest.webmanifest
          grep -q 'updateViaCache: '\''none'\''' index.html
          sw_version=$(sed -n "s/^const CACHE_VERSION = '\([^']*\)';$/\1/p" sw.js)
          test -n "$sw_version"
          grep -q "sw.js?v=${sw_version}" index.html
          grep -q "vary.includes('if-range')" sw.js
          grep -q "request.headers.has('if-range')" sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
